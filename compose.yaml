name: pgderive-control-plane

x-auth: &auth
  build: ./services/auth
  environment:
    BETTER_AUTH_URL: http://localhost:${PGDERIVE_HTTP_PORT:-8080}
    BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-local-compose-only-change-before-deploying-051fc87}
    DATABASE_URL: postgres://pgderive_auth:local_auth@auth-db:5432/pgderive_auth

services:
  envoy:
    image: envoyproxy/envoy:v1.38.0
    ports:
      - "127.0.0.1:${PGDERIVE_HTTP_PORT:-8080}:8080"
    volumes:
      - ./deploy/envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
    depends_on:
      - api
      - auth

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile

  auth:
    <<: *auth
    depends_on:
      auth-migrate:
        condition: service_completed_successfully

  auth-migrate:
    <<: *auth
    command: ["npm", "run", "migrate"]
    depends_on:
      auth-db:
        condition: service_healthy

  auth-db:
    image: postgres:17
    environment:
      POSTGRES_USER: pgderive_auth
      POSTGRES_PASSWORD: local_auth
      POSTGRES_DB: pgderive_auth
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U pgderive_auth -d pgderive_auth"]
      interval: 2s
      timeout: 3s
      retries: 15
