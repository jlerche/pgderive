static_resources:
  listeners:
    - name: public
      address:
        socket_address: { address: 0.0.0.0, port_value: 8080 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: pgderive
                normalize_path: true
                path_with_escaped_slashes_action: REJECT_REQUEST
                route_config:
                  name: public
                  virtual_hosts:
                    - name: pgderive
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/api/auth/" }
                          route: { cluster: auth }
                          typed_per_filter_config:
                            envoy.filters.http.ext_authz:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                              disabled: true
                        - match: { prefix: "/api/v1/organizations/" }
                          route: { cluster: api }
                        - match: { prefix: "/" }
                          direct_response: { status: 404 }
                          typed_per_filter_config:
                            envoy.filters.http.ext_authz:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                              disabled: true
                http_filters:
                  - name: envoy.filters.http.header_mutation
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.header_mutation.v3.HeaderMutation
                      mutations:
                        request_mutations:
                          - remove: x-pgderive-user-id
                          - remove: x-pgderive-organization-id
                  - name: envoy.filters.http.ext_authz
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
                      failure_mode_allow: false
                      allowed_headers:
                        patterns:
                          - exact: cookie
                      http_service:
                        server_uri:
                          uri: http://auth:3000
                          cluster: auth
                          timeout: 2s
                        path_prefix: /internal/check
                        authorization_response:
                          allowed_upstream_headers:
                            patterns:
                              - exact: x-pgderive-user-id
                              - exact: x-pgderive-organization-id
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: auth
      type: STRICT_DNS
      connect_timeout: 1s
      load_assignment:
        cluster_name: auth
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: auth, port_value: 3000 }
    - name: api
      type: STRICT_DNS
      connect_timeout: 1s
      load_assignment:
        cluster_name: api
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: api, port_value: 3001 }
