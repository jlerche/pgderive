name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Complete live release qualification
        type: boolean
        default: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy, rustfmt, llvm-tools-preview
      - run: sudo apt-get update && sudo apt-get install -y libclang-dev zstd
      - run: cargo install cargo-machete --version 0.9.2 --locked
      - run: cargo install cargo-llvm-cov --version 0.8.4 --locked
      - if: ${{ github.event_name == 'workflow_dispatch' && inputs.full }}
        run: ./scripts/check.sh --full
      - if: ${{ github.event_name != 'workflow_dispatch' || !inputs.full }}
        run: ./scripts/check.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence
          path: engine/artifacts/
