# Copy to worker.local.toml. Source tables/publication and owned schema must exist.
# Passwords can come from PGDERIVE__POSTGRES__PASSWORD.
[postgres]
host = "127.0.0.1"
port = 55434
database = "pgderive_dev"
user = "postgres"
tls = "disable" # Use "verify-full" for a TLS-enabled remote instance.
# ca_file = "/path/to/ca.pem"

[replication]
slot = "pgderive_worker" # Stable logical alias; actual UUID slot is journaled.
publication = "pgderive_worker_pub"

[listener]
max_transactions = 0 # Unlimited; Ctrl-C stops gracefully.
max_transaction_changes = 100000

# Local MVP harness: S3 requests pass through the latency proxy to SeaweedFS.
[object_store]
endpoint = "http://127.0.0.1:8333"
bucket = "pgderive-mvp-tests"
credentials_file = "s3.local.json"
# For remote storage, replace this section with the HTTPS example in
# docs/storage-configuration.md. Only credential files are accepted.

# Each operator spills exact coefficients before reaching these resident limits.
# Byte budgets count serialized records, with separate entry caps for overhead.
[execution]
cache_bytes = 16777216
cache_entries = 256
resident_bytes = 4194304
resident_entries = 4096
record_bytes = 65536
contributions = 10000000
spill_runs = 128
scratch_bytes = 1073741824
output_bytes = 67108864
output_entries = 250000

[worker]
catalog_schema = "pgderive_worker"
query_id = "auction_totals"
sink_table = "groups"
sink_output = "postgres" # Or "stdout": print attempted SQL/parameters, no result table.
object_prefix = "pgderive_worker" # Exclusively owned and stable across restarts.
block_rows = 4096
maintenance_ticks = 16
# Retain source WAL until immutable arrangement checkpoints cover published results.
memtable_bytes = 67108864 # Charged payload/structure budget; not an RSS limit.
checkpoint_interval_ms = 5000
phase_metrics = false # Opt-in execution boundary timings; see application qualification roadmap.
retry_attempts = 8
retry_delay_ms = 250
startup_timeout_secs = 180
max_transactions = 0 # Continuous. Ctrl-C drains the current transaction.

# Learned batching of complete source transactions; target is an objective.
[worker.epoch]
enabled = true
freshness_target_ms = 50
max_bytes = 8388608
max_transactions = 4096

# Illustrative warnings for an administrator-selected 8 GiB slot retention cap.
# Size from peak cluster WAL rate, outage tolerance and disk headroom; these are
# observations, not PostgreSQL disk limits. See docs/worker-health.md.
[worker.health]
retained_wal_alert_bytes = 1073741824
backlog_alert_bytes = 1073741824

[worker.query]
sql = "SELECT a.category, COUNT(*), SUM(b.price) FROM public.auction a JOIN public.bid b ON a.id=b.auction GROUP BY a.category"
# See docs/sql-compiler.md for the exact subset and destination mapping.
