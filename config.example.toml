# Copy to config.local.toml. Passwords can come from PGDERIVE__POSTGRES__PASSWORD.
[postgres]
host = "127.0.0.1"
port = 55434
database = "pgderive_dev"
user = "postgres"
tls = "disable" # Use "verify-full" for a TLS-enabled remote instance.
# ca_file = "/path/to/ca.pem"

[replication]
slot = "pgderive_dev_slot"
publication = "pgderive_dev_pub"

[listener]
max_transactions = 0 # Unlimited; Ctrl-C stops gracefully.
max_transaction_changes = 100000

# Local MVP harness: S3 requests pass through the latency proxy to SeaweedFS.
[object_store]
endpoint = "http://127.0.0.1:8334"
bucket = "pgderive-mvp-tests"
access_key_id = "local"
secret_access_key = "local"
