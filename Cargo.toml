[package]
name = "pgderive"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[dependencies]
anyhow = "1"
config = { version = "0.15", default-features = false, features = ["toml"] }
num-bigint = "0.4"
object_store = { version = "0.14.2", default-features = false, features = ["fs", "aws"] }
pgwire-replication = "=0.4.1"
postgres-replication = { git = "https://github.com/supabase/rust-postgres", rev = "8086f1fd19bd9abc0da86ba80f8b7dbdd676cb3e" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-postgres = { version = "0.7", default-features = false, features = ["runtime", "with-serde_json-1"] }

[lints.rust]
warnings = "deny"
unsafe_code = "forbid"
dead_code = "deny"
unused = { level = "deny", priority = -1 }
missing_docs = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cognitive_complexity = "deny"
too_many_lines = "deny"
too_many_arguments = "deny"
type_complexity = "deny"
excessive_nesting = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
undocumented_unsafe_blocks = "deny"
as_conversions = "deny"
wildcard_imports = "deny"
